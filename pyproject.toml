[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robocasa"
version = "0.2.0"
description = "RoboCasa simulation for MimicDroid (in-context learning from human play videos)"
readme = "README.md"
# numba 0.56.4 / numpy 1.23.3 only build for CPython <=3.10
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- upstream robocasa pins (verified working set) ---
    "numpy==1.23.3",
    "numba==0.56.4",
    "scipy>=1.2.3",
    "mujoco==3.2.6",
    "pygame",
    "Pillow",
    "opencv-python",
    "pyyaml",
    "pynput",
    "tqdm",
    "termcolor",
    "imageio",
    "h5py",
    "lxml",
    "hidapi",
    "tianshou==0.4.10",
    # mink 0.0.10 = last release with the `mink.tasks.exceptions` layout robosuite's
    # mink_controller imports, AND requires mujoco>=3.1.6 (compatible with 3.2.6).
    # 0.0.11+ moved the symbol; 1.x needs mujoco>=3.3 -> would break the GR1 path.
    "mink==0.0.10",
    "quadprog",           # default QP backend for mink.solve_ik
    "huggingface_hub",    # used by scripts/download_mimicdroid_dataset.py
    # NOTE: robosuite (abs_robot fork) is intentionally NOT listed here. GR1 needs
    # robosuite's examples/ (WHOLE_BODY_MINK_IK), which is present only in an
    # EDITABLE install, and uv/pip cannot editable-install from a Git URL. Install
    # it editable from a local clone before this package:
    #   git clone --branch abs_robot https://github.com/ShahRutav/robosuite
    #   uv pip install -e robosuite
    # (one-liner in a Dockerfile -- see the reflex eval-image sketch).
]

[tool.hatch.build.targets.wheel]
packages = ["robocasa"]
